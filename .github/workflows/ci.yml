name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Ruby のセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Yarn パッケージのインストール
        run: yarn install --frozen-lockfile

      - name: CSS のビルド
        run: yarn build:css

      - name: データベースのセットアップ
        run: bundle exec rails db:prepare

      - name: RSpec の実行
        run: bundle exec rspec
